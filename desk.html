<html lang="en">
<head>

<style>
:root {
  --bg: #f3f6f4; --card: #ffffff; --ink: #14201b; --muted: #5a6a62; --line: #d8e2dc;
  --brand: #0c7a52; --brand-ink: #ffffff; --brand-soft: #e4f3ec; --accent: #f2c230;
  --ok: #0c7a52; --bad: #b3261e; --bad-soft: #fbe9e7; --warn: #9a5b00; --warn-soft: #fdf1dc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1613; --card: #17211d; --ink: #e9f1ed; --muted: #94a69d; --line: #2a3832;
    --brand: #34c48e; --brand-ink: #062419; --brand-soft: #12342a;
    --ok: #34c48e; --bad: #ff8a80; --bad-soft: #3a1c19; --warn: #f0b555; --warn-soft: #3a2c12;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.wrap.has-bar { padding-bottom: 170px; }
[hidden] { display: none !important; }

.hero { position: relative; overflow: hidden; border-radius: 18px; padding: 22px 20px 20px; background: linear-gradient(160deg, #0a5e40, #0c7a52 70%); color: #fff; }
.hero .court { position: absolute; right: -14px; top: -6px; width: 190px; color: #fff; opacity: .16; }
.eyebrow { position: relative; margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.hero h1 { position: relative; margin: 0 0 6px; font-size: 26px; line-height: 1.15; }
.hero p { position: relative; margin: 0; font-size: 15px; opacity: .92; }

h2 { margin: 0; font-size: 17px; }
.sec { margin-top: 26px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.stack > * + * { margin-top: 10px; }

.btn { display: block; width: 100%; height: 50px; border: 0; border-radius: 13px; cursor: pointer; font: inherit; font-size: 16px; font-weight: 700; background: var(--brand); color: var(--brand-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .choice:focus-visible, .tab:focus-visible, .linklike:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 45%, transparent); outline-offset: 2px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.danger { background: transparent; color: var(--bad); border: 1.5px solid var(--bad); }
.btn.slim { display: inline-block; width: auto; height: 38px; padding: 0 16px; font-size: 14px; }
.linklike { padding: 0; border: 0; background: none; font: inherit; color: var(--brand); text-decoration: underline; cursor: pointer; }

input[type=text], input[type=password], input[type=search] {
  width: 100%; height: 48px; padding: 0 14px; font: inherit; color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 12px; appearance: none;
}
input:focus { outline: 3px solid color-mix(in srgb, var(--brand) 30%, transparent); border-color: var(--brand); }
select {
  width: 100%; height: 50px; padding: 0 12px; font: inherit; font-size: 16px; font-weight: 600; color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 12px;
}
select:focus { outline: 3px solid color-mix(in srgb, var(--brand) 30%, transparent); border-color: var(--brand); }
label.lbl { display: block; margin: 0 0 6px; font-size: 14px; font-weight: 600; }

.note { padding: 11px 13px; border-radius: 12px; background: var(--brand-soft); font-size: 14px; }
.note.warn { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.note.bad { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--line); color: var(--muted); }
.badge.ok { background: var(--brand); color: var(--brand-ink); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.code { font: 700 34px/1.1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .12em; }
.spin { display: inline-block; width: 16px; height: 16px; border: 2.5px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.tabs { display: flex; gap: 6px; margin: 16px 0; }
.tab { flex: 1; height: 42px; border: 1.5px solid var(--line); border-radius: 11px; background: var(--card); color: var(--ink); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
.tab[aria-selected=true] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.codein { font: 700 24px ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; }
.photo { display: block; width: 100%; max-height: 300px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); cursor: zoom-in; background: var(--line); min-height: 90px; }
table.lines { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 15px; }
table.lines td { padding: 8px 0; border-top: 1px solid var(--line); }
table.lines td:first-child { font-weight: 700; width: 46px; font-variant-numeric: tabular-nums; }
table.lines td:last-child { text-align: right; font-family: ui-monospace, Menlo, monospace; }
table.lines tr.tot td { border-top: 2px solid var(--line); font-weight: 800; }
.list .item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px; text-align: left; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.list .item + .item { margin-top: 8px; }
.list .item .c { font: 700 14px ui-monospace, Menlo, monospace; }
table.grid { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.grid th, table.grid td { padding: 8px 4px; text-align: center; border-top: 1px solid var(--line); }
table.grid th:first-child, table.grid td:first-child { text-align: left; font-weight: 700; }
table.grid td.low { background: var(--warn-soft); color: var(--warn); font-weight: 700; }
table.grid td.out { background: var(--bad-soft); color: var(--bad); font-weight: 700; }
table.grid td.na { color: var(--muted); }
.lightbox { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 12px; background: rgba(0,0,0,.88); cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <svg class="court" viewBox="0 0 120 60" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="114" height="54"/><line x1="60" y1="3" x2="60" y2="57"/><line x1="3" y1="12" x2="117" y2="12"/><line x1="3" y1="48" x2="117" y2="48"/><line x1="24" y1="3" x2="24" y2="57"/><line x1="96" y1="3" x2="96" y2="57"/><line x1="24" y1="30" x2="96" y2="30"/></g></svg>
    <p class="eyebrow">FTZ P.LAB Cup 2026 — GP Sports</p>
    <h1>Collection desk</h1>
    <p>Yonex bonus shirts. Staff only.</p>
  </header>

  <section id="login" class="card stack" style="margin-top:16px">
    <label class="lbl" for="pin">Desk PIN</label>
    <input id="pin" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <p class="note bad" id="loginErr" role="alert" hidden></p>
    <button class="btn" id="signin" type="button">Sign in</button>
  </section>

  <div id="app" hidden>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-find" aria-selected="true">Find a code</button>
      <button class="tab" role="tab" id="t-claims" aria-selected="false">All claims</button>
      <button class="tab" role="tab" id="t-stock" aria-selected="false">Stock</button>
    </div>
    <section id="p-find">
      <div class="row"><input id="code" class="codein" type="text" placeholder="ABC-123" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="10"><button class="btn slim" id="findgo" type="button" style="height:48px">Find</button></div>
      <p class="note bad" id="findErr" role="alert" hidden style="margin-top:12px"></p>
      <div id="result"></div>
    </section>
    <section id="p-claims" hidden></section>
    <section id="p-stock" hidden></section>
    <p class="small muted" style="margin-top:28px"><span id="who"></span> <button class="linklike" id="signout" type="button">Sign out</button></p>
  </div>
</main>
<script>
var API_URL = "https://script.google.com/macros/s/AKfycbySmwii-7B71opLbee2BQ_Uf9EcuBHJBd-Jc6ph3OeZgg8G2QyHF3CDW4bTq76z53XRoQ/exec";
var $ = function (id) { return document.getElementById(id); };
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var s = ''; for (var i = 0; i < 32; i++) s += Math.floor(Math.random() * 16).toString(16);
  return s.slice(0, 8) + '-' + s.slice(8, 12) + '-' + s.slice(12, 16) + '-' + s.slice(16, 20) + '-' + s.slice(20);
}
/* Talks to the Apps Script server: { fn, arg } as text/plain (a "simple" request, so no CORS preflight), JSON back.
   No cookies are sent, so it works whichever Google accounts this browser is signed in to. */
function call(fn, arg, ms, tries) {
  function once() {
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, ms || 40000);
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, arg: arg }), signal: ctl.signal })
      .then(function (r) { clearTimeout(timer); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); },
            function (e) { clearTimeout(timer); throw e; });
  }
  /* A plain read may ask for a second go (tries = 2) after a short pause: Google's relay now and then answers 503 once, and the
     hall's mobile data drops requests. A claim never does this — it is retried by the person tapping again, which is safe
     because every claim carries its own request id. */
  return once().catch(function (e) {
    if ((tries || 1) < 2) throw e;
    return new Promise(function (go) { setTimeout(go, 1200); }).then(once);
  });
}

/* ---- the quick photo check's advice (pure, so it is tested on its own) ----
   `check` = { faces, men, women } as counted ON THE PHONE by the small face model; `divisions` = the divisions of the teams
   being claimed (['mens'], ['womens'], or both). The estimate is rough, so this only ever WARNS — it never blocks a claim.
   Returns { line: what to tell the captain, warnings: [longer texts], short: [phrases for the desk's one-line note] }. */
function nOf_(x, one, many) { return x + ' ' + (x === 1 ? one : many); }
function photoAdvice(check, divisions) {
  var f = check.faces, m = check.men, w = check.women, out = { line: '', warnings: [], short: [] }, n = nOf_;
  var mens = divisions.indexOf('mens') >= 0, womens = divisions.indexOf('womens') >= 0;
  if (f > 0) out.line = 'We can see about ' + n(f, 'person', 'people') + ' (' + n(m, 'man', 'men') + ', ' + n(w, 'woman', 'women') + '). This is only a rough estimate.';
  if (f === 0) {
    out.warnings.push('We couldn’t spot any faces in this photo. Make sure your whole team is in the shot, facing the camera, with your company flag.');
    out.short.push('no faces found');
  } else if (f < 3) {
    out.warnings.push('We can only see ' + n(f, 'face', 'faces') + '. Is your whole team in the photo?');
    out.short.push('only ' + n(f, 'face', 'faces'));
  } else if (mens && !womens && w > m) {
    out.warnings.push('This looks like mostly women, but you picked a men’s team.');
    out.short.push('mostly women, men\'s team');
  } else if (womens && !mens && m > w) {
    out.warnings.push('This looks like mostly men, but you picked a women’s team.');
    out.short.push('mostly men, women\'s team');
  }
  return out;
}

/* The one line the desk sees next to the photo, e.g. "11 faces (7 men, 4 women) · CHECK: mostly women, men's team". */
function photoNoteText(check, divisions) {
  var a = photoAdvice(check, divisions);
  return nOf_(check.faces, 'face', 'faces') + ' (' + nOf_(check.men, 'man', 'men') + ', ' + nOf_(check.women, 'woman', 'women') + ')' + (a.short.length ? ' · CHECK: ' + a.short.join('; ') : '');
}

</script>
<script>
(function () {
  var pin = '', DESIGNS = { 'Black Print': 1, 'Navy Peony': 2, 'Jet Black': 3 };
  function get(k) { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function put(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
  function staff() { try { return localStorage.getItem('yx-staff') || ''; } catch (e) { return ''; } }
  function say(id, msg) { var n = $(id); n.textContent = msg || ''; n.hidden = !msg; }
  function desk(fn, arg) {
    arg = arg || {}; arg.pin = pin;
    return call(fn, arg, 45000).then(function (r) {
      if (r && r.ok === false && (r.kind === 'bad_pin' || r.kind === 'locked' || r.kind === 'not_configured')) { signOut(r.error); throw new Error('auth'); }
      return r;
    });
  }

  // ---------- sign in ----------
  function signIn(p, open) {
    pin = p; say('loginErr', ''); $('signin').disabled = true; $('signin').textContent = 'Checking…';
    return call('admin_stock', { pin: p }).then(function (r) {
      $('signin').disabled = false; $('signin').textContent = 'Sign in';
      if (!r.ok) { pin = ''; say('loginErr', r.error); return; }
      put('yx-pin', open ? '' : p); $('login').hidden = true; $('app').hidden = false; $('code').focus();
      $('who').textContent = open ? 'No PIN is set, so this desk is open to anyone who has this page.' : 'Signed in.'; $('signout').hidden = !!open; showStock(r);
    }, function () { $('signin').disabled = false; $('signin').textContent = 'Sign in'; pin = ''; say('loginErr', 'Couldn’t reach the server. Check the connection and try again.'); });
  }
  function signOut(msg) { pin = ''; put('yx-pin', ''); $('app').hidden = true; $('login').hidden = false; $('pin').value = ''; say('loginErr', msg || ''); $('result').textContent = ''; }
  $('signin').onclick = function () { signIn($('pin').value.trim()); };
  $('pin').onkeydown = function (e) { if (e.key === 'Enter') $('signin').click(); };
  $('signout').onclick = function () { signOut(''); };

  // ---------- tabs ----------
  function tab(name) {
    ['find', 'claims', 'stock'].forEach(function (n) { $('p-' + n).hidden = n !== name; $('t-' + n).setAttribute('aria-selected', n === name ? 'true' : 'false'); });
    if (name === 'claims') loadClaims(); if (name === 'stock') loadStock(); if (name === 'find') $('code').focus();
  }
  ['find', 'claims', 'stock'].forEach(function (n) { $('t-' + n).onclick = function () { tab(n); }; });

  // ---------- find + hand over ----------
  function find(code) {
    code = (code || $('code').value).trim(); if (code.length < 5) return say('findErr', 'Enter the 6-character code.');
    say('findErr', ''); $('result').textContent = ''; $('findgo').disabled = true;
    desk('admin_lookup', { code: code }).then(function (r) {
      $('findgo').disabled = false;
      if (!r.ok) return say('findErr', r.error);
      $('code').value = r.claim.code; showClaim(r.claim);
    }, function (e) { $('findgo').disabled = false; if (e.message !== 'auth') say('findErr', 'Couldn’t reach the server. Try again.'); });
  }
  $('findgo').onclick = function () { find(); };
  $('code').onkeydown = function (e) { if (e.key === 'Enter') find(); };

  function badge(status) {
    var b = el('span', 'badge' + (status === 'reserved' ? ' ok' : status === 'cancelled' ? ' bad' : ''), status === 'reserved' ? 'Ready' : status === 'collected' ? 'Already collected' : 'Cancelled');
    return b;
  }
  function showClaim(c) {
    var out = $('result'); out.textContent = '';
    var card = el('div', 'card'); card.style.marginTop = '16px';
    var head = el('div', 'row'); var h = el('h2', 'grow', c.company); head.appendChild(h); head.appendChild(badge(c.status)); card.appendChild(head);
    card.appendChild(el('p', 'muted', c.teamLabels.join(' + ') + ' · ' + c.entitlement + ' entitled')).style.margin = '4px 0 0';
    if (c.status === 'collected') card.appendChild(el('p', 'small muted', 'Collected ' + c.collectedAt + ' by ' + c.collectedBy)).style.margin = '4px 0 0';
    if (c.status === 'cancelled') card.appendChild(el('p', 'small muted', 'Cancelled' + (c.note ? ': ' + c.note : ''))).style.margin = '4px 0 0';

    if (c.hasPhoto) {
      var img = el('img', 'photo'); img.alt = c.company + ' team photo'; img.style.marginTop = '14px'; card.appendChild(img);
      card.appendChild(el('p', 'small muted', 'Tap to enlarge. Check it’s this team, at the ceremony, with their flag.')).style.margin = '6px 0 0';
      // the captain's phone counted faces on this photo: a rough estimate, only a hint — you decide
      if (c.status !== 'cancelled' && c.note) card.appendChild(el('p', /CHECK:/.test(c.note) ? 'note warn' : 'small muted', c.note)).style.marginTop = '8px';
      desk('admin_photo', { code: c.code }).then(function (r) {
        if (r.ok) { img.src = 'data:' + r.mime + ';base64,' + r.b64; img.onclick = function () { lightbox(img.src); }; }
        else { img.replaceWith(note('bad', r.error)); }
      }, function () {});
    } else card.appendChild(note('bad', 'No photo on this claim.')).style.marginTop = '14px';

    var tb = el('table', 'lines'), body = el('tbody');
    c.lines.forEach(function (l) { var tr = el('tr'); tr.appendChild(el('td', null, l.qty + '×')); tr.appendChild(el('td', null, l.design)); tr.appendChild(el('td', null, l.size)); body.appendChild(tr); });
    var tot = el('tr', 'tot'); tot.appendChild(el('td', null, c.total + '×')); var tt = el('td', null, 'total'); tt.colSpan = 2; tt.style.textAlign = 'left'; tt.style.fontFamily = 'inherit'; tot.appendChild(tt); body.appendChild(tot);
    tb.appendChild(body); card.appendChild(tb);

    if (c.status === 'reserved') {
      var who = el('div'); who.style.marginTop = '16px'; who.appendChild(el('label', 'lbl', 'Handed over by (optional)'));
      var name = el('input'); name.type = 'text'; name.maxLength = 40; name.value = staff(); name.autocomplete = 'off'; who.appendChild(name); card.appendChild(who);
      var ok = el('button', 'btn', 'Hand over & mark collected'); ok.type = 'button'; ok.style.marginTop = '12px';
      ok.onclick = function () {
        ok.disabled = true; ok.textContent = 'Saving…';
        try { localStorage.setItem('yx-staff', name.value.trim()); } catch (e) {}
        desk('admin_collect', { code: c.code, by: name.value.trim() }).then(function (r) {
          if (!r.ok) { ok.disabled = false; ok.textContent = 'Hand over & mark collected'; return say('findErr', r.error); }
          say('findErr', ''); showClaim(r.claim); out.insertBefore(note('', '✓ Marked collected. Hand over ' + r.claim.total + ' shirts.'), out.firstChild);
        }, function (e) { ok.disabled = false; ok.textContent = 'Hand over & mark collected'; if (e.message !== 'auth') say('findErr', 'Couldn’t save — check the connection and tap again.'); });
      };
      card.appendChild(ok);
      var cancel = el('button', 'btn danger', 'Cancel this claim…'); cancel.type = 'button'; cancel.style.marginTop = '10px';
      cancel.onclick = function () {
        cancel.hidden = true;
        var box = el('div', 'stack'); box.style.marginTop = '10px';
        box.appendChild(el('label', 'lbl', 'Why? (wrong company, no flag in photo…)'));
        var why = el('input'); why.type = 'text'; why.maxLength = 80; box.appendChild(why);
        var yes = el('button', 'btn danger', 'Yes, cancel it and free the shirts'); yes.type = 'button';
        yes.onclick = function () {
          yes.disabled = true;
          desk('admin_cancel', { code: c.code, reason: why.value.trim() }).then(function (r) { if (!r.ok) { yes.disabled = false; return say('findErr', r.error); } say('findErr', ''); showClaim(r.claim); }, function (e) { yes.disabled = false; if (e.message !== 'auth') say('findErr', 'Couldn’t save. Try again.'); });
        };
        box.appendChild(yes); card.appendChild(box); why.focus();
      };
      card.appendChild(cancel);
    }
    out.appendChild(card);
  }
  function note(kind, text) { return el('p', 'note ' + kind, text); }
  function lightbox(src) { var d = el('div', 'lightbox'), i = el('img'); i.src = src; d.appendChild(i); d.onclick = function () { d.remove(); }; document.body.appendChild(d); }

  // ---------- all claims ----------
  var filterBy = 'all';
  function loadClaims() {
    var box = $('p-claims'); box.textContent = ''; box.appendChild(el('p', 'muted center', 'Loading…'));
    desk('admin_claims').then(function (r) {
      box.textContent = '';
      if (!r.ok) return box.appendChild(note('bad', r.error));
      var bar = el('div', 'row'), q = el('input'); q.type = 'search'; q.placeholder = 'Search company or code'; bar.appendChild(q); box.appendChild(bar);
      var chips = el('div', 'row'); chips.style.margin = '10px 0'; ['all', 'reserved', 'collected', 'cancelled'].forEach(function (f) {
        var b = el('button', 'tab', f === 'all' ? 'All' : f === 'reserved' ? 'Ready' : f[0].toUpperCase() + f.slice(1)); b.type = 'button'; b.setAttribute('aria-selected', f === filterBy ? 'true' : 'false'); b.style.height = '36px';
        b.onclick = function () { filterBy = f; loadClaims(); }; chips.appendChild(b);
      }); box.appendChild(chips);
      var list = el('div', 'list'); box.appendChild(list);
      function draw() {
        list.textContent = ''; var t = q.value.trim().toLowerCase(), n = 0;
        r.claims.filter(function (c) { return (filterBy === 'all' || c.status === filterBy) && (!t || c.company.toLowerCase().indexOf(t) >= 0 || c.code.toLowerCase().indexOf(t) >= 0); }).forEach(function (c) {
          n++; var it = el('button', 'item'); it.type = 'button'; var g = el('div', 'grow'); g.appendChild(el('div', 'strong', c.company));
          g.appendChild(el('div', 'small muted', c.teamLabels.join(' + ') + ' · ' + c.total + ' shirts · ' + c.created.slice(5, 16) + (c.flagged ? ' · photo check flagged' : '')));
          it.appendChild(g); it.appendChild(el('span', 'c', c.code)); it.appendChild(badge(c.status));
          it.onclick = function () { tab('find'); $('code').value = c.code; find(c.code); }; list.appendChild(it);
        });
        if (!n) list.appendChild(el('p', 'muted center', r.claims.length ? 'Nothing matches.' : 'No claims yet.'));
      }
      q.oninput = draw; draw();
    }, function (e) { box.textContent = ''; if (e.message !== 'auth') box.appendChild(note('bad', 'Couldn’t load. Check the connection.')); });
  }

  // ---------- stock ----------
  function loadStock() { desk('admin_stock').then(showStock, function () {}); }
  function showStock(r) {
    var box = $('p-stock'); box.textContent = ''; if (!r.ok) return box.appendChild(note('bad', r.error));
    box.appendChild(el('p', 'strong', r.totals.claimed + ' claimed · ' + (r.totals.total - r.totals.claimed) + ' free of ' + r.totals.total));
    box.appendChild(el('p', 'small muted', r.claims.reserved + ' waiting to be collected · ' + r.claims.collected + ' collected · ' + r.claims.cancelled + ' cancelled')).style.margin = '2px 0 12px';
    // sizes down the side, the designs across: three columns fit a phone, eight do not
    var designs = []; r.stock.forEach(function (s) { if (designs.indexOf(s.design) < 0) designs.push(s.design); });
    var card = el('div', 'card'), tb = el('table', 'grid'), hd = el('tr'); hd.appendChild(el('th', null, 'Size')); designs.forEach(function (d) { hd.appendChild(el('th', null, d)); });
    var thead = el('thead'); thead.appendChild(hd); tb.appendChild(thead); var body = el('tbody');
    r.sizes.forEach(function (z) {
      if (!r.stock.some(function (x) { return x.size === z; })) return;
      var tr = el('tr'); tr.appendChild(el('td', null, z));
      designs.forEach(function (d) {
        var s = r.stock.filter(function (x) { return x.design === d && x.size === z; })[0], td = el('td');
        if (!s) { td.textContent = '–'; td.className = 'na'; } else { td.textContent = s.available + '/' + s.total; td.className = s.available === 0 ? 'out' : s.available <= 5 ? 'low' : ''; }
        tr.appendChild(td);
      }); body.appendChild(tr);
    });
    tb.appendChild(body); card.appendChild(tb); box.appendChild(card);
    box.appendChild(el('p', 'small muted', 'Left / total. Amber = 5 or fewer left. Red = none left. Dash = never stocked in that design.')).style.marginTop = '10px';
    var rf = el('button', 'btn ghost slim', 'Refresh'); rf.type = 'button'; rf.style.marginTop = '8px'; rf.onclick = loadStock; box.appendChild(rf);
  }

  // ---------- go ----------
  // No PIN in the Sheet (Settings B1 blank) = the desk opens straight away. A PIN typed there brings the sign-in back.
  var saved = get('yx-pin');
  function askForPin() { if (saved) signIn(saved); else $('pin').focus(); }
  call('admin_status', {}).then(function (r) { if (r && r.ok && r.needsPin === false) signIn('', true); else askForPin(); }, askForPin);
})();
</script>
