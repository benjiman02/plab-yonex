<style>
:root {
  --bg: #f3f6f4; --card: #ffffff; --ink: #14201b; --muted: #5a6a62; --line: #d8e2dc;
  --brand: #0c7a52; --brand-ink: #ffffff; --brand-soft: #e4f3ec; --accent: #f2c230;
  --ok: #0c7a52; --bad: #b3261e; --bad-soft: #fbe9e7; --warn: #9a5b00; --warn-soft: #fdf1dc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1613; --card: #17211d; --ink: #e9f1ed; --muted: #94a69d; --line: #2a3832;
    --brand: #34c48e; --brand-ink: #062419; --brand-soft: #12342a;

}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.wrap.has-bar { padding-bottom: 170px; }
[hidden] { display: none !important; }

.hero { position: relative; overflow: hidden; border-radius: 18px; padding: 22px 20px 20px; background: linear-gradient(160deg, #0a5e40, #0c7a52 70%); color: #fff; }
.hero .court { position: absolute; right: -14px; top: -6px; width: 190px; color: #fff; opacity: .16; }
.eyebrow { position: relative; margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.hero h1 { position: relative; margin: 0 0 6px; font-size: 26px; line-height: 1.15; }
.hero p { position: relative; margin: 0; font-size: 15px; opacity: .92; }

h2 { margin: 0; font-size: 17px; }
.sec { margin-top: 26px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.stack > * + * { margin-top: 10px; }

.btn { display: block; width: 100%; height: 50px; border: 0; border-radius: 13px; cursor: pointer; font: inherit; font-size: 16px; font-weight: 700; background: var(--brand); color: var(--brand-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .choice:focus-visible, .tab:focus-visible, .linklike:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 45%, transparent); outline-offset: 2px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.danger { background: transparent; color: var(--bad); border: 1.5px solid var(--bad); }
.btn.slim { display: inline-block; width: auto; height: 38px; padding: 0 16px; font-size: 14px; }
.linklike { padding: 0; border: 0; background: none; font: inherit; color: var(--brand); text-decoration: underline; cursor: pointer; }

input[type=text], input[type=password], input[type=search] {
  width: 100%; height: 48px; padding: 0 14px; font: inherit; color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 12px; appearance: none;
}
input:focus { outline: 3px solid color-mix(in srgb, var(--brand) 30%, transparent); border-color: var(--brand); }
label.lbl { display: block; margin: 0 0 6px; font-size: 14px; font-weight: 600; }

.note { padding: 11px 13px; border-radius: 12px; background: var(--brand-soft); font-size: 14px; }
.note.warn { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.note.bad { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--line); color: var(--muted); }
.badge.ok { background: var(--brand); color: var(--brand-ink); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.code { font: 700 34px/1.1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .12em; }
.spin { display: inline-block; width: 16px; height: 16px; border: 2.5px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

.center { text-align: center; }
.grow { flex: 1; min-width: 0; }
.block { display: block; }
.strong { font-weight: 700; font-size: 15px; }
.choice { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; text-align: left; font: inherit; color: inherit; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; }
.choice[aria-checked=true] { border-color: var(--brand); background: var(--brand-soft); }
.choice:disabled { opacity: .5; cursor: not-allowed; }
.tick { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line); font-size: 13px; font-weight: 800; color: #fff; }
.choice[aria-checked=true] .tick { background: var(--brand); border-color: var(--brand); }
.sizecard { padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.sizecard h3 { margin: 0 0 10px; font-size: 16px; }
.sizecard h3 span { float: right; font-size: 12px; font-weight: 400; color: var(--muted); }
.line { display: flex; align-items: center; gap: 12px; }
.line + .line { margin-top: 10px; }
.sw { flex: none; width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line); }
.left { font-size: 12px; color: var(--muted); }
.left.none { color: var(--bad); }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); font-size: 20px; line-height: 1; cursor: pointer; }
.step button:disabled { opacity: .3; cursor: not-allowed; }
.step .n { min-width: 30px; text-align: center; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.photobox { margin-top: 12px; padding: 14px; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; }
.photobox.ok { border-color: var(--ok); }
.photobox img { display: block; width: 100%; max-height: 260px; object-fit: cover; border-radius: 10px; }
.pick { display: flex; align-items: center; justify-content: center; padding: 30px 10px; border: 2px dashed var(--line); border-radius: 12px; color: var(--brand); font-weight: 700; cursor: pointer; }
.pick input, .retake input { display: none; }
.retake { display: inline-block; margin-top: 10px; padding: 8px 16px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 14px; font-weight: 600; cursor: pointer; }
.mini { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; font-size: 14px; }
.mini + .mini { margin-top: 8px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
.bar .in { display: flex; align-items: center; gap: 12px; max-width: 640px; margin: 0 auto; }
.bar .btn { width: auto; height: 46px; padding: 0 22px; flex: none; }
.bar .top { font-weight: 700; font-variant-numeric: tabular-nums; }
.bar .msg { font-size: 12.5px; color: var(--muted); }
.bar .msg.ok { color: var(--ok); }
.bar .err { max-width: 640px; margin: 8px auto 0; color: var(--bad); font-size: 14px; font-weight: 600; }
.done .eyebrow { color: var(--ok); }
table.sum { width: 100%; margin-top: 12px; border-collapse: collapse; font-size: 14px; }
table.sum td { padding: 7px 0; border-top: 1px solid var(--line); }
table.sum td:first-child { font-weight: 700; width: 44px; }
table.sum td:last-child { text-align: right; font-family: ui-monospace, Menlo, monospace; }
</style>

<body>
<main class="wrap" id="wrap">
  <header class="hero">
    <svg class="court" viewBox="0 0 120 60" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="114" height="54"/><line x1="60" y1="3" x2="60" y2="57"/><line x1="3" y1="12" x2="117" y2="12"/><line x1="3" y1="48" x2="117" y2="48"/><line x1="24" y1="3" x2="24" y2="57"/><line x1="96" y1="3" x2="96" y2="57"/><line x1="24" y1="30" x2="96" y2="30"/></g></svg>
    <p class="eyebrow">FTZ P.LAB Cup 2026 — Yonex bonus shirt</p>

<noscript><p style="padding:20px">This page needs JavaScript to claim your shirts. Please turn it on, or message the GP Sports team.</p></noscript>
<script>
var API_URL = "https://script.google.com/macros/s/AKfycbySmwii-7B71opLbee2BQ_Uf9EcuBHJBd-Jc6ph3OeZgg8G2QyHF3CDW4bTq76z53XRoQ/exec";
var $ = function (id) { return document.getElementById(id); };
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var s = ''; for (var i = 0; i < 32; i++) s += Math.floor(Math.random() * 16).toString(16);
  return s.slice(0, 8) + '-' + s.slice(8, 12) + '-' + s.slice(12, 16) + '-' + s.slice(16, 20) + '-' + s.slice(20);
}
/* Talks to the Apps Script server: { fn, arg } as text/plain (a "simple" request, so no CORS preflight), JSON back.
   No cookies are sent, so it works whichever Google accounts this browser is signed in to. */
function call(fn, arg, ms, tries) {
  function once() {
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, ms || 40000);
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, arg: arg }), signal: ctl.signal })
      .then(function (r) { clearTimeout(timer); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); },
            function (e) { clearTimeout(timer); throw e; });
  }
  /* A plain read may ask for a second go (tries = 2) after a short pause: Google's relay now and then answers 503 once, and the
     hall's mobile data drops requests. A claim never does this — it is retried by the person tapping again, which is safe
     because every claim carries its own request id. */
  return once().catch(function (e) {
    if ((tries || 1) < 2) throw e;
    return new Promise(function (go) { setTimeout(go, 1200); }).then(once);
  });
}

</script>
<script>
(function () {
  var S = { token: '', data: null, picked: {}, qty: {}, photo: null, photoBusy: false, amend: '', busy: false, requestId: '', error: '', done: null, refs: [] };
  var SWATCH = { 'Black Print': 'linear-gradient(135deg,#1a1a1a 0%,#1a1a1a 55%,#c8e63c 55%,#1a1a1a 100%)', 'Navy Peony': '#1f2f4d', 'Jet Black': '#111111' };

  // ---------- small helpers ----------
  function note(kind, text) { return el('p', 'note ' + kind, text); }
  function changed() { S.requestId = ''; S.error = ''; }   // any edit makes the next Confirm a new request
  function pickedTeams() { return S.data.teams.filter(function (t) { return S.picked[t.key]; }); }
  function anyPicked() { return pickedTeams().length > 0; }
  function ent() { return pickedTeams().reduce(function (a, t) { return a + t.entitlement; }, 0); }
  function total() { return Object.keys(S.qty).reduce(function (a, k) { return a + S.qty[k]; }, 0); }
  function held() {
    var m = {}, c = S.amend && S.data.claims.filter(function (x) { return x.code === S.amend; })[0];
    if (c) c.lines.forEach(function (l) { m[l.stockKey] = l.qty; });
    return m;
  }
  function headroom(row) { return row.available + (held()[row.key] || 0); }   // what this claim already holds is free for it to keep
  function photoOk() { return !!S.photo || !!S.amend; }
  function isOpen() { return S.data.open !== false; }
  function view() { var v = $('view'); v.textContent = ''; return v; }
  function showBar(on) { $('bar').hidden = !on; $('wrap').className = 'wrap' + (on ? ' has-bar' : ''); }

  // ---------- load ----------
  function load(quiet) {
    if (!quiet) { view().appendChild(el('p', 'center muted', 'Loading…')); showBar(false); }
    return call('api_company', { token: S.token }, 40000, 2).then(function (res) {
      if (!res.ok) { if (!quiet) (res.kind === 'not_found' ? invalid(res.error) : retry(res.error)); return false; }
      S.data = res; $('title').textContent = res.company.name; document.title = res.company.name + ' – Yonex bonus shirt';
      clamp();
      return true;
    }, function () { if (!quiet) retry("Couldn't load. Check your connection and try again."); return false; });
  }
  function invalid(msg) {
    var v = view(); showBar(false);
    var c = el('div', 'card stack', null);
    c.appendChild(el('h2', null, 'This link isn’t working'));
    c.appendChild(el('p', 'muted', msg || 'Please ask GP Sports for your company’s personal link.'));
    v.appendChild(c); v.firstChild.style.marginTop = '20px';
  }
  function retry(msg) {
    var v = view(), c = el('div', 'card stack'); showBar(false);
    c.appendChild(el('p', null, msg));
    var b = el('button', 'btn', 'Try again'); b.type = 'button'; b.onclick = function () { start(); }; c.appendChild(b);
    v.appendChild(c); c.style.marginTop = '20px';
  }
  // stock may have moved under us: never keep more than is left
  function clamp() {
    var trimmed = false;
    S.data.stock.forEach(function (row) {
      var n = S.qty[row.key] || 0, max = headroom(row);
      if (n > max) { if (max > 0) S.qty[row.key] = max; else delete S.qty[row.key]; trimmed = true; }
    });
    if (trimmed) S.error = 'Some sizes just ran low, so your picks were adjusted. Please check them.';
  }

  // ---------- the form ----------
  function render() {
    if (S.done) return renderDone();
    var y = window.scrollY, v = view(); S.refs = [];
    if (!isOpen()) v.appendChild(note('warn', 'Claiming is closed right now. If you think it should be open, please see the GP Sports team.'));
    if (S.amend) v.appendChild(amendBanner());
    v.appendChild(teamsSection());
    if (anyPicked()) { v.appendChild(shirtsSection()); v.appendChild(photoSection()); }
    else v.appendChild(el('p', 'muted small center', 'Pick a team above to continue.')).style.marginTop = '28px';
    var others = S.data.claims.filter(function (c) { return c.code !== S.amend; });
    if (others.length) v.appendChild(othersSection(others));
    showBar(anyPicked()); updateShirts(); updateBar();
    window.scrollTo(0, y);
  }

  function amendBanner() {
    var b = note('', ''); b.style.marginTop = '18px';
    b.appendChild(document.createTextNode('Changing claim '));
    b.appendChild(el('strong', null, S.amend));
    b.appendChild(document.createTextNode('. Your photo is kept unless you add a new one. '));
    var x = el('button', 'linklike', 'Cancel'); x.type = 'button'; x.onclick = function () { resetForm(); render(); }; b.appendChild(x);
    return b;
  }

  function teamsSection() {
    var sec = el('section', 'sec'), n = S.data.teams.length;
    // Companies field 1 to 4 teams (a second squad in a division is common), so the wording follows the count.
    var hint = n === 1 ? 'Tick your team to continue.'
      : n === 2 ? 'Tick one or both. If a colleague already claimed the other team, that’s fine — just take yours.'
      : 'Tick every team you’re collecting for. Several together is fine, or each team’s captain can claim their own on this same link. A team a colleague has already claimed is greyed out.';
    sec.appendChild(el('h2', null, n === 1 ? '1. Your team' : '1. Which teams are you collecting for?'));
    sec.appendChild(el('p', 'muted small', hint)).style.margin = '4px 0 12px';
    var grid = el('div', 'stack');
    S.data.teams.forEach(function (t) {
      var on = !!S.picked[t.key], locked = !!t.claimedBy && !on;
      var b = el('button', 'choice'); b.type = 'button'; b.setAttribute('role', 'checkbox'); b.setAttribute('aria-checked', on ? 'true' : 'false');
      b.disabled = locked || !isOpen();
      b.appendChild(el('span', 'tick', on ? '✓' : ''));
      var txt = el('span', 'grow'); txt.appendChild(el('span', 'strong block', t.label));
      txt.appendChild(el('span', 'muted small block', t.claimedBy ? (t.claimedBy.collected ? 'Collected · ' : (S.amend === t.claimedBy.code ? 'Changing this claim · ' : 'Claimed by a colleague · ')) + t.claimedBy.code : t.entitlement + ' shirts'));
      b.appendChild(txt);
      b.onclick = function () { if (S.picked[t.key]) delete S.picked[t.key]; else S.picked[t.key] = true; changed(); render(); };
      grid.appendChild(b);
    });
    sec.appendChild(grid);
    return sec;
  }

  function shirtsSection() {
    var sec = el('section', 'sec');
    sec.appendChild(el('h2', null, '2. Choose ' + ent() + ' shirts'));
    sec.appendChild(el('p', 'muted small', 'Designs are limited and shared across all 75 teams — this is live stock, first come first served. You can change your picks until you collect.')).style.margin = '4px 0 12px';
    var wrap = el('div', 'stack');
    S.data.sizes.forEach(function (size) {
      var rows = S.data.stock.filter(function (r) { return r.size === size; });
      if (!rows.length) return;
      var card = el('div', 'sizecard'), h = el('h3', null, size);
      if (rows.length === 1) h.appendChild(el('span', null, rows[0].design + ' only'));
      card.appendChild(h);
      rows.forEach(function (row) {
        var line = el('div', 'line'), sw = el('span', 'sw'); sw.style.background = SWATCH[row.design] || '#888';
        var who = el('div', 'grow'); who.appendChild(el('div', 'strong', row.design)); var left = el('div', 'left'); who.appendChild(left);
        var step = el('div', 'step'), minus = el('button', null, '−'), num = el('span', 'n', '0'), plus = el('button', null, '+');
        minus.type = plus.type = 'button';
        minus.setAttribute('aria-label', 'Remove one ' + row.design + ' ' + size); plus.setAttribute('aria-label', 'Add one ' + row.design + ' ' + size);
        minus.onclick = function () { bump(row, -1); }; plus.onclick = function () { bump(row, 1); };
        step.appendChild(minus); step.appendChild(num); step.appendChild(plus);
        line.appendChild(sw); line.appendChild(who); line.appendChild(step); card.appendChild(line);
        S.refs.push({ row: row, left: left, num: num, minus: minus, plus: plus });
      });
      wrap.appendChild(card);
    });
    sec.appendChild(wrap);
    return sec;
  }

  function bump(row, d) {
    var now = S.qty[row.key] || 0, rem = ent() - total();
    var next = Math.max(0, Math.min(now + d, headroom(row), now + Math.max(0, rem)));
    if (next > 0) S.qty[row.key] = next; else delete S.qty[row.key];
    changed(); updateShirts(); updateBar();
  }

  function updateShirts() {
    var rem = ent() - total();
    S.refs.forEach(function (r) {
      var n = S.qty[r.row.key] || 0, free = headroom(r.row);
      r.num.textContent = n;
      r.left.textContent = free === 0 ? 'None left' : free + ' left'; r.left.className = 'left' + (free === 0 ? ' none' : '');
      r.minus.disabled = n === 0 || !isOpen();
      r.plus.disabled = n >= free || rem <= 0 || !isOpen();
    });
  }

  function photoSection() {
    var sec = el('section', 'sec');
    sec.appendChild(el('h2', null, '3. Your team photo'));
    var p = el('p', 'muted small'); p.style.margin = '4px 0 0';
    p.appendChild(document.createTextNode('The shirts are free — the photo is how you pay for them. Take a group shot of your team at the opening ceremony '));
    p.appendChild(el('strong', null, 'with your company flag'));
    p.appendChild(document.createTextNode(', then add it here.' + (S.data.teams.length > 1 ? ' Claiming for more than one team? One shot of everyone together is fine — or each team can claim separately with its own photo.' : '') + ' Only GP Sports staff at the counter will see it, and only to check your claim.'));
    sec.appendChild(p);
    var box = el('div', 'photobox'); box.id = 'photobox'; sec.appendChild(box);
    fillPhotoBox(box);
    return sec;
  }
  function fileInput() {
    var i = el('input'); i.type = 'file'; i.accept = 'image/*'; i.id = 'photofile'; i.disabled = S.photoBusy;
    i.onchange = function () { if (i.files && i.files[0]) readPhoto(i.files[0]); };
    return i;
  }
  function fillPhotoBox(box) {
    box = box || $('photobox'); if (!box) return;
    box.textContent = ''; box.className = 'photobox' + (photoOk() ? ' ok' : '');
    if (S.photo) {
      var img = el('img'); img.alt = 'Your team photo'; img.src = S.photo.preview; box.appendChild(img);
      var l = el('label', 'retake', 'Retake'); l.appendChild(fileInput()); box.appendChild(l);
    } else if (S.amend) {
      var q = el('p', 'muted'); q.style.margin = '0'; q.appendChild(document.createTextNode('Keeping the photo you already sent. '));
      var r = el('label', 'linklike', 'Replace it'); r.appendChild(fileInput()); q.appendChild(r); box.appendChild(q);
    } else {
      var l2 = el('label', 'pick'); l2.appendChild(document.createTextNode(S.photoBusy ? 'Preparing photo…' : '📷  Add team photo')); l2.appendChild(fileInput()); box.appendChild(l2);
    }
  }

  // Shrink in the browser before it leaves the phone: the hall will be on crowded mobile data and this upload is mandatory.
  function readPhoto(file) {
    S.photoBusy = true; S.error = ''; fillPhotoBox(); updateBar();
    var url = URL.createObjectURL(file), img = new Image();
    function fail() { URL.revokeObjectURL(url); S.photoBusy = false; S.error = 'Could not read that photo. Try taking it again.'; fillPhotoBox(); updateBar(); }
    img.onerror = fail;
    img.onload = function () {
      try {
        var scale = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * scale)); c.height = Math.max(1, Math.round(img.naturalHeight * scale));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var q = 0.8, data;
        do { data = c.toDataURL('image/jpeg', q); q -= 0.2; } while (data.length > 2400000 && q > 0.2);
        if (data.indexOf('data:image/jpeg;base64,') !== 0) return fail();
        S.photo = { mime: 'image/jpeg', b64: data.slice(data.indexOf(',') + 1), preview: data };
        changed();
      } catch (e) { return fail(); }
      URL.revokeObjectURL(url); S.photoBusy = false; fillPhotoBox(); updateBar();
    };
    img.src = url;
  }

  function othersSection(list) {
    var sec = el('section', 'sec'); sec.style.borderTop = '1px solid var(--line)'; sec.style.paddingTop = '18px';
    sec.appendChild(el('h2', null, 'Already claimed at your company')).style.fontSize = '15px';
    var wrap = el('div'); wrap.style.marginTop = '10px';
    list.forEach(function (c) {
      var m = el('div', 'mini'), t = el('div', 'grow');
      t.appendChild(el('div', 'strong', c.teamLabels.join(' + ')));
      var sub = el('div', 'muted small'); sub.appendChild(el('span', null, c.code)); sub.firstChild.style.fontFamily = 'ui-monospace, Menlo, monospace';
      sub.appendChild(document.createTextNode(' · ' + (c.status === 'collected' ? 'collected' : c.entitlement + ' shirts reserved'))); t.appendChild(sub);
      m.appendChild(t);
      if (c.status !== 'collected' && isOpen()) { var b = el('button', 'btn ghost slim', 'Change'); b.type = 'button'; b.onclick = function () { startAmend(c); }; m.appendChild(b); }
      wrap.appendChild(m);
    });
    sec.appendChild(wrap);
    return sec;
  }

  function updateBar() {
    if (!S.data || S.done) return;
    var t = total(), e = ent(), rem = e - t, ok = false, msg;
    $('barTop').textContent = t + ' of ' + e + ' picked';
    if (S.photoBusy) msg = 'Preparing your photo…';
    else if (rem < 0) msg = 'Remove ' + (-rem) + ' shirt' + (rem === -1 ? '' : 's') + ' to continue';
    else if (t === 0) msg = rem + ' still to choose';
    else if (!photoOk()) msg = 'Add your team photo to confirm';
    else { ok = true; msg = rem === 0 ? 'Ready to confirm' : rem + ' still to choose (you can claim fewer)'; }
    $('barMsg').textContent = msg; $('barMsg').className = 'msg' + (ok ? ' ok' : '');
    $('go').disabled = S.busy || S.photoBusy || !ok || !isOpen();
    $('go').textContent = S.busy ? 'Saving…' : (S.amend ? 'Save changes' : 'Confirm claim');
    $('barErr').textContent = S.error; $('barErr').hidden = !S.error;
  }

  // ---------- send ----------
  function submit() {
    if (S.busy || S.photoBusy) return;
    var keys = pickedTeams().map(function (t) { return t.key; });
    var lines = Object.keys(S.qty).filter(function (k) { return S.qty[k] > 0; }).map(function (k) { return { stockKey: k, qty: S.qty[k] }; });
    if (!S.requestId) S.requestId = uuid();
    var snapshot = { teams: pickedTeams().map(function (t) { return t.label; }), lines: S.data.stock.filter(function (r) { return S.qty[r.key] > 0; }).map(function (r) { return { design: r.design, size: r.size, qty: S.qty[r.key] }; }) };
    var req = { token: S.token, requestId: S.requestId, teamKeys: keys, lines: lines, amendCode: S.amend || null, photo: S.photo ? { mime: S.photo.mime, b64: S.photo.b64 } : null };
    S.busy = true; S.error = ''; updateBar();
    call('api_claim', req, 90000).then(function (res) {
      S.busy = false;
      if (res.ok) {
        S.requestId = ''; S.done = { code: res.code, amended: !!res.amended, teams: snapshot.teams, lines: snapshot.lines };
        renderDone(); load(true).then(function (ok) { if (ok && S.done) renderDone(); });
      } else {
        S.error = res.error || 'Something went wrong. Please try again.'; updateBar();
        if (res.kind === 'out_of_stock' || res.kind === 'already_claimed') load(true).then(function () { render(); });
        if (res.kind === 'busy') S.error = 'The system is busy — please tap Confirm again in a moment.';
        updateBar();
      }
    }, function () {
      S.busy = false; S.error = 'Couldn’t send it — check your connection and tap the button again. Tapping again is safe: it won’t claim twice.'; updateBar();
    });
  }

  function startAmend(c) {
    S.amend = c.code; S.picked = {}; c.teamKeys.forEach(function (k) { S.picked[k] = true; });
    S.qty = {}; c.lines.forEach(function (l) { S.qty[l.stockKey] = l.qty; });
    S.photo = null; S.done = null; changed(); render(); window.scrollTo(0, 0);
  }
  function resetForm() { S.amend = ''; S.picked = {}; S.qty = {}; S.photo = null; S.done = null; changed(); }

  function renderDone() {
    var d = S.done, v = view(); showBar(false);
    var card = el('div', 'card done'); card.style.marginTop = '20px';
    card.appendChild(el('p', 'eyebrow', (d.amended ? 'Updated' : 'Reserved') + ' — ' + d.teams.join(' + ')));
    card.appendChild(el('p', 'code', d.code)).style.margin = '8px 0';
    card.appendChild(el('p', 'muted', 'Photo received. Show this code at the GP Sports counter to collect. Screenshot it — you’ll need it to change anything later.'));
    var tb = el('table', 'sum'), body = el('tbody'), n = 0;
    d.lines.forEach(function (l) { n += l.qty; var tr = el('tr'); tr.appendChild(el('td', null, l.qty + '×')); tr.appendChild(el('td', null, l.design)); tr.appendChild(el('td', null, l.size)); body.appendChild(tr); });
    var tr2 = el('tr'); tr2.appendChild(el('td', null, n + '×')); var tdt = el('td', null, 'total'); tdt.colSpan = 2; tdt.style.textAlign = 'left'; tdt.style.fontFamily = 'inherit'; tr2.appendChild(tdt); body.appendChild(tr2);
    tb.appendChild(body); card.appendChild(tb);
    var mine = S.data.claims.filter(function (c) { return c.code === d.code; })[0];
    var actions = el('div', 'stack'); actions.style.marginTop = '16px';
    if (mine && mine.status !== 'collected' && isOpen()) { var ch = el('button', 'btn ghost', 'Change this claim'); ch.type = 'button'; ch.onclick = function () { startAmend(mine); }; actions.appendChild(ch); }
    if (S.data.teams.some(function (t) { return !t.claimedBy; }) && isOpen()) { var an = el('button', 'btn ghost', 'Claim for another team too'); an.type = 'button'; an.onclick = function () { resetForm(); render(); window.scrollTo(0, 0); }; actions.appendChild(an); }
    card.appendChild(actions);
    v.appendChild(card);
  }

  // ---------- go ----------
  function start() {
    S.token = new URLSearchParams(location.search).get('c') || '';
    if (!S.token) return invalid('This page needs your company’s personal link. Please ask GP Sports to send it to you again.');
    load().then(function (ok) { if (ok) render(); });
  }
  $('go').onclick = submit;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !S.data || S.busy || S.photoBusy || S.done) return;
    load(true).then(function (ok) { if (ok) { var y = window.scrollY; render(); window.scrollTo(0, y); } });
  });
  start();
})();
</script>
</body>
</html>
