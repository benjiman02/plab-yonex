* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

.wrap.has-bar { padding-bottom: 170px; }
[hidden] { display: none !important; }

h2 { margin: 0; font-size: 17px; }

.btn:disabled { opacity: .45; cursor: not-allowed; }

input[type=text], input[type=password], input[type=search] {
  width: 100%; height: 48px; padding: 0 14px; font: inherit; color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 12px; appearance: none;

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbySmwii-7B71opLbee2BQ_Uf9EcuBHJBd-Jc6ph3OeZgg8G2QyHF3CDW4bTq76z53XRoQ/exec";
var $ = function (id) { return document.getElementById(id); };
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var s = ''; for (var i = 0; i < 32; i++) s += Math.floor(Math.random() * 16).toString(16);
  return s.slice(0, 8) + '-' + s.slice(8, 12) + '-' + s.slice(12, 16) + '-' + s.slice(16, 20) + '-' + s.slice(20);
}
/* Talks to the Apps Script server: { fn, arg } as text/plain (a "simple" request, so no CORS preflight), JSON back.
   No cookies are sent, so it works whichever Google accounts this browser is signed in to. */
function call(fn, arg, ms, tries) {
  function once() {
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, ms || 40000);
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, arg: arg }), signal: ctl.signal })
      .then(function (r) { clearTimeout(timer); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); },
            function (e) { clearTimeout(timer); throw e; });
  }
  /* A plain read may ask for a second go (tries = 2) after a short pause: Google's relay now and then answers 503 once, and the
     hall's mobile data drops requests. A claim never does this — it is retried by the person tapping again, which is safe
     because every claim carries its own request id. */
  return once().catch(function (e) {
    if ((tries || 1) < 2) throw e;
    return new Promise(function (go) { setTimeout(go, 1200); }).then(once);
  });
}

/* ---- the photo check's advice (pure, so it is tested on its own) ----
   `check` = { faces, said } — faces as counted ON THE PHONE; said = how many people the captain says are in the photo, when they
   corrected the count (0 or missing = they did not). The number limits the shirts (cap() in the page); this only adds a warning
   when the photo looks wrong for a team photo, and flags it for the desk when the captain says MORE people than were counted.
   (There used to be a men/women guess too. It was dropped on 3 Oct 2026: on test photos it called 17 of 18 players of a women's
   team "men", and it would have told that team it looked like a men's team.)
   Returns { warnings: [texts for the captain], short: [phrases for the desk's one-line note] }. */
function nOf_(x, one, many) { return x + ' ' + (x === 1 ? one : many); }
function photoAdvice(check) {
  var f = check.faces, out = { warnings: [], short: [] };
  if (f === 0) {
    out.warnings.push('We couldn’t spot any faces in this photo. Make sure your whole team is in the shot, facing the camera, with your company flag.');
    out.short.push('no faces found');
  } else if (f < 3) {
    out.warnings.push('We can only see ' + nOf_(f, 'face', 'faces') + '. Is your whole team in the photo?');
    out.short.push('only ' + nOf_(f, 'face', 'faces'));
  }
  if (check.said > f) out.short.push('captain says ' + nOf_(check.said, 'person', 'people'));   // staff check the photo before handing out
  return out;
}

/* The one line the desk sees next to the photo, e.g. "11 faces", "2 faces · CHECK: only 2 faces", "11 faces · CHECK: captain says
   13 people", or "17 faces · captain says 15 people" (fewer than counted — a bystander was counted: noted, not flagged). The server
   reads the count from it (facesFromCheck_ in src/Api.js): the captain's number when there is one, else the "<number> face(s)" it
   must start with. */
function photoNoteText(check) {
  var a = photoAdvice(check), fewer = check.said > 0 && check.said < check.faces;
  return nOf_(check.faces, 'face', 'faces') + (fewer ? ' · captain says ' + nOf_(check.said, 'person', 'people') : '') + (a.short.length ? ' · CHECK: ' + a.short.join('; ') : '');
}

<script>
var COMPANIES = ["Agilent","Ambest","AMBU","AMD","Amphenol","Analog Devices","ASE Electronics","B.Braun","Bizlink","Broadcom","Bruker","Chipbond Technology","Coherent","Dell","Dexcom","Dufu Technology","Efinix Technology","Emerson","Flex","GUH","HP","Infineon","Intel","Jabil","Keysight","KMWE","Knowles","Kyocera AVX","Lam Research","Microchip","Micron","Motorola","Osram","Pentamaster","Pixart","Plexus","Renesas","SAM","Sandisk","Sanmina","Stratus Automation","Tecan","TF-AMD","VAT","Vitrox"];
var COMPANY_LABELS = {"Analog Devices":"Analog Devices (ADI)","Efinix Technology":"Efinix Technology (Efinix)","Pixart":"Pixart (PixArt Imaging)","Stratus Automation":"Stratus Automation (Stratus)"};

<script>
/* ---- Counting the people in the team photo, ON THE PHONE (nothing is uploaded for it) ----
   Two face detectors, each good where the other is weak:
   1. SSD MobileNet v1 (@vladmandic/face-api, vendor/) makes the count. It looks at the whole photo first; when the faces it finds
      are small for the photo (a wide shot of a big team) it looks again at four overlapping quarters, enlarged, and adds any face
      it is sure of that it had not seen yet. A face it is unsure of counts only when it is about the size of the faces it IS sure
      of (that keeps a teammate half-hidden in the back row, and drops someone small walking past behind). A weaker box that
      overlaps a stronger one is the same person — in a tightly packed back row SSD likes to put a second box between two heads.
   2. YuNet (OpenCV, vendor/models/yunet.onnx, run by onnxruntime-web) is the second opinion. It is better with faces in shadow
      (caps, hat brims), half-hidden or turned away — but it also sees far more bystanders. So it only ADDS a face that it is very
      sure of, that is the size of the group's faces, and that is not a face already counted. If YuNet cannot run on a phone (very
      old iOS), the count is SSD's alone.
   3. Passers-by are left out (5 Oct 2026): a group of faces that stands apart from everyone else and is all small — people walking
      behind, another team further back — is not the team (fcNoPassersBy).
   On 27 test photos with a known count (posed teams of 3 to 18, a 32-person lineup, group selfies, schoolgirls in tudung, the
   owner's own 15-person stand selfie, empty halls) this counts all 27 exactly — in Chrome and in WebKit (Safari's engine) alike;
   SSD alone got 23, and the very first counter (TinyFaceDetector) found nobody at all in the 15- and 18-person teams (README,
   "Photo check"). On 5 Oct the owner's ams OSRAM photo (12 players, 4 passers-by) counted 16; step 3 makes it 12, and changes
   nothing on the others. The thresholds below were chosen on those photos.
   Pure geometry first (tested in Node), then the parts that need the browser. */
var FACECOUNT = {
  MIN: 0.35,         // SSD's lowest score that is looked at
  SURE: 0.55,        // from this score up an SSD face always counts
  NEAR: 0.6,         // an unsure face counts if it is at least this fraction of the typical sure face's width
  SMALL: 0.04,       // sure faces narrower than this fraction of the photo's long side (typical) → look at the quarters too
  OVERLAP: 0.3,      // how much neighbouring quarters overlap, so a face cut by one quarter's edge is whole in the next
  DUP_IOU: 0.25,     // a weaker box overlapping a stronger one this much (over their union) …
  DUP_IOM: 0.45,     // … or this much of itself is the same face
  YN_MIN: 0.5,       // YuNet's lowest score that is looked at
  YN_NMS: 0.3,       // YuNet's own boxes overlapping this much are one face
  YN_ADD: 0.8,       // YuNet adds a face only from this score up …
  YN_SIZE: 0.7,      // … and only at least this fraction of the typical width of the faces SSD is sure of
  GROUP: 3.5,        // two faces stand together when their centres are within this many face widths (the average of the two) …
  APART: 0.62        // … and a group in which every face is narrower than this fraction of the photo's typical face is passers-by
};

function fcOverlap(a, b) {   // { iou, iom }: the boxes' intersection over their union, and over the smaller box
  var x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y), x2 = Math.min(a.x + a.w, b.x + b.w), y2 = Math.min(a.y + a.h, b.y + b.h);
  var i = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  if (!i) return { iou: 0, iom: 0 };
  return { iou: i / (a.w * a.h + b.w * b.h - i), iom: i / Math.min(a.w * a.h, b.w * b.h) };
}
/* Two boxes are the same face when they overlap well, one sits mostly inside the other, or their centres nearly coincide (the
   boxes of a small face drift a few pixels between looks, so their overlap alone can be low). Neighbours in a row are a whole
   face-width apart, so they never pass this. */
function fcSame(a, b) {
  var o = fcOverlap(a, b);
  return o.iou > 0.3 || o.iom > 0.6 ||
    (Math.abs(a.x + a.w / 2 - b.x - b.w / 2) < 0.5 * Math.max(a.w, b.w) && Math.abs(a.y + a.h / 2 - b.y - b.h / 2) < 0.5 * Math.max(a.h, b.h));
}
/* The faces of the first look, plus those of `more` (strongest first) that are not a face already counted. */
function fcAdd(base, more) {
  var all = base.slice();
  more.slice().sort(function (a, b) { return b.score - a.score; }).forEach(function (b) {
    if (!all.some(function (k) { return fcSame(k, b); })) all.push(b);
  });
  return all;
}
/* One box per face: strongest first; a box overlapping a kept one by DUP_IOU of their union, or DUP_IOM of itself, is the same face.
   (Two real faces never overlap that much — the one behind would be hidden.) */
function fcDedup(boxes) {
  var keep = [];
  boxes.slice().sort(function (a, b) { return b.score - a.score; }).forEach(function (b) {
    if (!keep.some(function (k) { var o = fcOverlap(k, b); return o.iou > FACECOUNT.DUP_IOU || o.iom > FACECOUNT.DUP_IOM; })) keep.push(b);
  });
  return keep;
}
function fcMedian(xs) { var s = xs.slice().sort(function (a, b) { return a - b; }), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : 0; }

   person to person) form a group; a group in which EVERY face is small (under APART × the photo's typical face) is passers-by and is
   not counted. So a small face standing with the team (the back row, someone half-hidden) stays, and so does anyone of normal size,
   wherever they stand. On the test photos every setting from GROUP 2.5 to 4 and APART 0.55 to 0.7 counts them all right; these sit

/* YuNet's raw output → face boxes. `out` maps 'cls_8' … 'bbox_32' to flat arrays (one value per grid cell, four per box), for an

   √(cls · obj); its box centre is ((c + dx) · s, (r + dy) · s) and its size (e^dw · s, e^dh · s). Then non-maximum suppression. */

}

/* YuNet on a canvas with onnxruntime-web `ort` and its `session`. The input is what OpenCV feeds it: BGR, 0–255, NCHW, padded at

/* Count the faces on a canvas with face-api `f` (its SSD model loaded) and, when given, YuNet `yn` ({ ort, session }).

<script>

    if (c) c.lines.forEach(function (l) { m[l.size] = (m[l.size] || 0) + l.qty; });
    return m;
  }
  function available(size) { return S.data.stock.filter(function (r) { return r.size === size; }).reduce(function (a, r) { return a + r.available; }, 0); }
  function headroom(size) { return available(size) + (held()[size] || 0); }   // what this claim already holds is free for it to keep

  function startAmend(c) {   // its sizes, as they are now, ready to change
    S.amend = c.code; S.picked = {}; S.qty = {}; c.lines.forEach(function (l) { S.qty[l.size] = (S.qty[l.size] || 0) + l.qty; });
    S.photo = null; S.done = null; changed(); render(); window.scrollTo(0, 0);
  }
  function resetForm() { S.amend = ''; S.picked = {}; S.qty = {}; S.photo = null; S.done = null; changed(); }
  // "Change sizes" on the done card: the claim just made, from the company's data (fetched again if it has not arrived yet)
  function changeSizes(code, btn) {
    function find() { return S.data && S.data.claims.filter(function (x) { return x.code === code; })[0]; }
    if (find()) return startAmend(find());
    btn.disabled = true; btn.textContent = 'Opening…';
    load(true).then(function (ok) { if (ok && find()) startAmend(find()); else { btn.disabled = false; btn.textContent = 'Change sizes'; } });
  }

  // Done: a simple message (the owner's words, 5 Oct: "just a simple message that says, will distribute the t-shirts soon"), the sizes
  // in one small line, and "Change sizes" (the owner: "give them the option to change their t-shirt size at the end"). No code: GP
  // Sports brings the shirts to the team.
  function renderDone() {
    var d = S.done, v = view(), n = d.lines.reduce(function (a, l) { return a + l.qty; }, 0); showBar(false);
    var card = el('div', 'card done center'); card.style.marginTop = '20px';
    card.appendChild(el('div', 'tickbig', '✓')).setAttribute('aria-hidden', 'true');
    card.appendChild(el('h2', null, d.amended ? 'Updated!' : 'Done!'));
    card.appendChild(el('p', 'msg', d.amended ? 'Your new sizes are saved. GP Sports will distribute the T-shirts soon.' : 'Your T-shirts are reserved. GP Sports will distribute them soon.'));
    card.appendChild(el('p', 'muted small', d.company + (d.teams ? ' · ' + d.teams : '') + ' · ' + nOf_(n, 'shirt', 'shirts') + ': ' + d.lines.map(function (l) { return l.qty + ' × ' + l.size; }).join(', '))).style.margin = '14px 0 0';
    if (!S.data || isOpen()) {
      var b = el('button', 'btn ghost', 'Change sizes'); b.type = 'button'; b.onclick = function () { changeSizes(d.code, b); }; card.appendChild(b);
      card.appendChild(el('p', 'muted small', 'Someone wants another size? Change it here until the shirts are handed out — or later: open this link again, pick ' + d.company + (d.teams ? ' and tap ' + d.teams : '') + '.')).style.margin = '10px 0 0';
    }
    v.appendChild(card);
  }

  // ---------- go ----------
  // Everyone opens the same link and picks their company from the list. An earlier private link (…?c=<token>) still works.
  function who() { return S.token ? { token: S.token } : { company: S.company }; }
  function start() {
    S.token = new URLSearchParams(location.search).get('c') || '';
    if (S.token) { $('picker').hidden = true; return reload(); }
    setupPicker(); reload();
  }
  function reload() {
    if (!S.token && !S.company) return prompt_();
    load().then(function (ok) { if (ok) render(); });
  }
  function setupPicker() {
    var sel = $('company'); $('picker').hidden = false;
    if (!sel.options.length) {
      sel.appendChild(new Option('Choose your company…', ''));
      COMPANIES.forEach(function (n) { sel.appendChild(new Option(COMPANY_LABELS[n] || n, n)); });
      sel.onchange = function () { pick(sel.value); };
    }
    var saved = ''; try { saved = localStorage.getItem('yx-company') || ''; } catch (e) {}   // this phone remembers the last company picked
    if (!S.company && COMPANIES.indexOf(saved) >= 0) S.company = saved;
    sel.value = S.company;
  }
  function pick(name) {
    S.company = name; try { localStorage.setItem('yx-company', name); } catch (e) {}
    // Part-way through a claim (the wrong company picked first) the photo, its count and the sizes picked stay, so the captain does not
    // have to add the photo again. But once a claim is made — or while one is being changed — they belong to that claim: the next
    // company starts afresh, with its own team photo.
    if (S.done || S.amend) resetForm(); else { S.picked = {}; changed(); }   // (the teams ticked were the other company's)
    S.data = null; $('title').textContent = 'Claim your shirts'; document.title = 'Yonex bonus shirt – FTZ P.LAB Cup 2026';
    reload();
  }
  function prompt_() { renderWaiting('Choose your company above to start.'); }
  $('go').onclick = submit;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !S.data || S.busy || S.photoBusy || S.done) return;
    load(true).then(function (ok) { if (ok) { var y = window.scrollY; render(); window.scrollTo(0, y); } });
  });
  start();
})();
</script>
</body>
</html>
